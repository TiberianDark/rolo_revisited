name: Windows development package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up package Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64

      - name: Install vcpkg and SDL3
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone https://github.com/microsoft/vcpkg.git $vcpkg
          & (Join-Path $vcpkg "bootstrap-vcpkg.bat") -disableMetrics
          if ($LASTEXITCODE) { throw 'vcpkg bootstrap failed' }
          & (Join-Path $vcpkg "vcpkg.exe") install sdl3:x64-windows-static
          if ($LASTEXITCODE) { throw 'SDL3 installation failed' }
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Windows executable
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DBUILD_TESTING=OFF `
            -DROLO_COPY_RUNTIME_PACKS=OFF `
            -DROLO_SDL3_STATIC=ON `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build native engine
        run: cmake --build build --config Release --target rolo_native

      - name: Assemble and check complete package
        run: python tools/package_windows.py --engine build/Release/rolo_native.exe --output dist/rolo-revisited-windows-dev

      - name: Upload unsigned development package
        uses: actions/upload-artifact@v4
        with:
          name: rolo-revisited-windows-dev
          path: dist/rolo-revisited-windows-dev/
          if-no-files-found: error
          retention-days: 14
